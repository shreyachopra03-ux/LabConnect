# Local Postgres for development:   docker compose up -d db
# Full stack (db + migrations + app): docker compose up --build
services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-reports}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab} -d ${POSTGRES_DB:-reports}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Database viewer in the browser: http://localhost:8080 (local development only)
  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

  # Production build. On start it applies migrations (and seeds demo data if DEMO_MODE=true).
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:-lab_dev_password}@db:5432/${POSTGRES_DB:-reports}?schema=public
      NODE_ENV: production
      STORAGE_DIR: /app/data/storage
      LIS_EXPORT_DIR: /app/data/lis-export
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]

volumes:
  pgdata:
  appdata:
